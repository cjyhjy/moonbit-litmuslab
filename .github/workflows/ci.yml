name: LitmusLab checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core-and-interfaces:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checksummed MoonBit toolchain
        run: |
          mkdir -p .ci-evidence
          set -o pipefail
          python3 tools/bootstrap.py 2>&1 | tee .ci-evidence/bootstrap.log
          ./tools/moon version --all > .ci-evidence/moon-version.txt
          node --version > .ci-evidence/node-version.txt
          python3 --version > .ci-evidence/python-version.txt
      - name: Validate three backends, artifacts, references, witnesses and interfaces
        # Uses recorded herd7 outcomes; does not claim a fresh external tool run.
        run: python3 tools/verify.py --check-dist --output-dir .ci-evidence
      - name: Upload evidence for this commit and run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litmuslab-ci-${{ github.sha }}
          path: .ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
