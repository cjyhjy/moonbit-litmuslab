name: LitmusLab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-interfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/bootstrap.py
      - run: bash tools/build.sh
      - run: ./tools/moon check --target js
      - run: ./tools/moon test --target js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/crosscheck.py
      - run: node tools/check-interfaces.mjs
      # Replays the recorded external outcome sets; does not claim a fresh herd run.
      - run: node tools/oracle-compare.mjs
      - run: node bin/litmuslab.mjs analyze examples/store-buffering.litmus --model both
